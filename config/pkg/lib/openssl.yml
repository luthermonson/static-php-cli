openssl:
  type: library
  artifact:
    source:
      type: ghrel
      repo: openssl/openssl
      match: openssl-3.+\.tar\.gz
      prefer-stable: true
    source-mirror:
      type: filelist
      url: 'https://openssl-library.org/source/'
      regex: '/href="[^"]*\/(?<file>openssl-(?<version>3\.[0-9.]+)\.tar\.gz)"/'
      download-url: 'https://github.com/openssl/openssl/releases/download/openssl-{version}/{file}'
    metadata:
      license-files: [LICENSE.txt]
      license: OpenSSL
  depends:
    - zlib
  depends@windows:
    - zlib
    - jom
  headers:
    - openssl
  static-libs@unix:
    - libssl.a
    - libcrypto.a
  static-libs@windows:
    - libssl.lib
    - libcrypto.lib
